{% extends "base.html" %}

{% block content %}
<section class="auth-wrapper" aria-labelledby="signup-title">
    <div class="auth-card">
        <a class="auth-brand" href="{{ url_for('hello_world') }}">PaisaWallet</a>
        <h1 class="auth-title" id="signup-title">Create account</h1>
        <p class="auth-subtitle">Your account starts with NPR 5,000.</p>
        <form method="POST" action="{{ url_for('signup') }}" class="auth-form" id="signup-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="signup-name" class="form-label">Full name</label>
                <input type="text" name="name" id="signup-name" class="form-control" autocomplete="name" required autofocus>
            </div>
            <div class="form-group">
                <label for="signup-phone" class="form-label">Phone number</label>
                <input type="tel" name="phone_number" id="signup-phone" class="form-control" autocomplete="tel" required>
                <span class="field-hint">Used as your wallet identifier for transfers.</span>
            </div>
            <div class="form-group">
                <label for="signup-password" class="form-label">Password</label>
                <input type="password" name="password" id="signup-password" class="form-control" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="signup-confirm" class="form-label">Confirm password</label>
                <input type="password" name="confirm_password" id="signup-confirm" class="form-control" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="signup-submit-btn">Create account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</section>
{% endblock %}
