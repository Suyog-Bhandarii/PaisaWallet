{% extends "base.html" %}

{% block content %}
<section class="auth-wrapper" aria-labelledby="login-title">
    <div class="auth-card">
        <a class="auth-brand" href="{{ url_for('hello_world') }}">PaisaWallet</a>
        <h1 class="auth-title" id="login-title">Log in</h1>
        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="auth-form" id="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="login-phone" class="form-label">Phone number</label>
                <input type="tel" name="phone_number" id="login-phone" class="form-control" autocomplete="tel" required autofocus>
            </div>
            <div class="form-group">
                <label for="login-password" class="form-label">Password</label>
                <input type="password" name="password" id="login-password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">Log in</button>
        </form>
        <p class="auth-footer">No account? <a href="{{ url_for('signup') }}">Create account</a></p>
    </div>
</section>
{% endblock %}
