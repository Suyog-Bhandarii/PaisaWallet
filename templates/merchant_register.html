{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="auth-icon-bubble">🏪</div>
            <h1 class="auth-title">Become a Merchant</h1>
            <p class="auth-subtitle">Accept cashless payments instantly with your personalized Paisa QR code.</p>
        </div>

        <form method="POST" action="{{ url_for('merchant_register') }}" class="auth-form" id="merchant-register-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="merchant-name" class="form-label">Business / Shop Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">🏢</span>
                    <input 
                        type="text" 
                        name="name" 
                        id="merchant-name" 
                        class="form-control" 
                        placeholder="e.g. Pokhara Bakery or Tech Store" 
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="merchant-emoji" class="form-label">Business Category Icon (Emoji)</label>
                <div class="input-wrapper">
                    <span class="input-icon">✨</span>
                    <input 
                        type="text" 
                        name="emoji" 
                        id="merchant-emoji" 
                        class="form-control" 
                        placeholder="e.g. ☕, 🥐, 🛒, 🍕, 💻" 
                        value="🏪"
                    >
                </div>
                <span class="field-hint">Choose an icon that best represents your brand.</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-submit-merchant">
                <span>Activate Merchant & Generate QR</span>
                <span class="btn-arrow">→</span>
            </button>
        </form>

        <div class="auth-footer">
            <p><a href="{{ url_for('dashboard') }}" class="link-highlight">← Back to Wallet</a></p>
        </div>
    </div>
</div>
{% endblock %}
