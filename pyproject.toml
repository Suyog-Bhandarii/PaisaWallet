[project]
name = "paisa-wallet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.3",
    "Flask-Bcrypt>=1.0.1",
    "python-dotenv>=1.0.0",
    "qrcode>=8.0",
    "pillow>=10.0.0",
    "Flask-WTF>=1.2.0",
    "Flask-Limiter>=3.5.0",
    "Flask-Migrate>=4.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    "migrations",
    "manual_test_wallet_service.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",    # Line length handled gracefully
]
