services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paisa_wallet_test
      POSTGRES_USER: paisa
      POSTGRES_PASSWORD: paisa_test_password
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paisa -d paisa_wallet_test"]
      interval: 3s
      timeout: 3s
      retries: 20
